name: Build backend provider images

on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Providers to build (comma-separated, or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - cpu
          - nvidia
          - rockchip
      push:
        description: 'Push to ghcr.io after build'
        required: true
        default: 'true'
        type: boolean
  push:
    paths:
      - 'mnemos-backend/**'
      - '.github/workflows/build-backend-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    name: Resolve target providers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          all='[{"provider":"cpu","arch":"amd64","runner":"ubuntu-latest","target":"linux/amd64","base_image":"python:3.14-slim"},{"provider":"cpu","arch":"arm64","runner":"ubuntu-24.04-arm","target":"linux/arm64","base_image":"python:3.14-slim"},{"provider":"nvidia","arch":"amd64","runner":"ubuntu-latest","target":"linux/amd64","base_image":"nvidia/cuda:12.4.1-cudnn-runtime-ubuntu24.04"},{"provider":"rockchip","arch":"arm64","runner":"ubuntu-24.04-arm","target":"linux/arm64","base_image":"python:3.14-slim"}]'
          wanted="${{ inputs.providers }}"
          if [[ "$wanted" == "all" || -z "$wanted" ]]; then
            matrix="$all"
          else
            wanted_csv=$(echo "$wanted" | tr ',' '\n' | tr -d ' ' | sed '/^$/d' | paste -sd '|' -)
            matrix=$(echo "$all" | jq -c "[ .[] | select(.provider | test(\"^($wanted_csv)$\")) ]")
            if [[ "$matrix" == "[]" || -z "$matrix" ]]; then
              echo "::error::No matching providers for input: $wanted" >&2
              exit 1
            fi
          fi
          one_line=$(printf '%s' "$matrix" | tr -d '\n')
          { echo "matrix<<EOF"; echo "$one_line"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.provider }} / ${{ matrix.arch }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    env:
      SHOULD_PUSH: ${{ needs.resolve.outputs.should_push }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Read backend version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' \
            mnemos-backend/app/_version.py | head -n1)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read version from mnemos-backend/app/_version.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        # Only authenticate when we're actually about to push. This keeps
        # CI-only runs from exercising the registry token.
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (versioned + stable)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./mnemos-backend
          file: ./mnemos-backend/Dockerfile
          platforms: ${{ matrix.target }}
          # Coerced to a real boolean via env so YAML 1.2 strict
          # parsing accepts it. The action rejects expression-shaped
          # values like ${{ inputs.push }}.
          push: ${{ env.SHOULD_PUSH == 'true' }}
          load: ${{ env.SHOULD_PUSH != 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mnemos-backend:${{ steps.version.outputs.version }}-${{ matrix.provider }}
            ghcr.io/${{ github.repository_owner }}/mnemos-backend:stable-${{ matrix.provider }}
          build-args: |
            INSTALL_PROVIDER=${{ matrix.provider }}
            BASE_IMAGE=${{ matrix.base_image }}
          cache-from: type=gha,scope=backend-${{ matrix.provider }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.provider }}-${{ matrix.arch }}
