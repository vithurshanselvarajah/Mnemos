# =============================================================================
# CI — run on every push and PR
# =============================================================================
#
# Job graph (gate-and-build):
#
#     lint
#       │
#       ▼
#     test
#       │
#       ├─► build-backend-matrix   (one row per (provider, arch) combo)
#       └─► build-frontend-matrix  (one row per arch: amd64, arm64)
#
# - lint runs first on its own.
# - test depends on lint, so a lint failure skips the whole suite.
# - Both image-build jobs depend on test, so a broken test never
#   wastes runner minutes on a doomed image build.
# - Image builds never push — that's the release workflow's job.
#
# Reused by:
#   - .github/workflows/release-all.yml
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        run: |
          python -m pip install --upgrade "pip>=25"
          python -m pip install --only-binary=:all: "ruff==0.15.22"

      - name: Run ruff check
        run: python -m ruff check --config ruff.toml .

      - name: Run ruff format --check
        run: python -m ruff format --check --config ruff.toml .

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('mnemos-backend/requirements.txt', 'mnemos-frontend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade "pip>=25"
          python -m pip install --only-binary=:all: --prefer-binary \
            -r mnemos-backend/requirements.txt

      - name: Install frontend dependencies
        run: |
          python -m pip install --only-binary=:all: --prefer-binary \
            -r mnemos-frontend/requirements.txt

      - name: Install test tooling
        run: |
          python -m pip install --only-binary=:all: --prefer-binary \
            pytest

      - name: Run pytest
        env:
          MNEMOS_DB_PATH: ${{ runner.temp }}/backend.db
          MNEMOS_FE_DB_PATH: ${{ runner.temp }}/frontend.db
          MNEMOS_FE_SECRET: test-secret-do-not-use-in-prod-32-bytes-min
        run: python -m pytest tests/

  build-backend-matrix:
    name: Backend build (${{ matrix.provider }} / ${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: cpu
            arch: amd64
            runner: ubuntu-26.04
            target: linux/amd64
            base_image: python:3.14-slim
          - provider: cpu
            arch: arm64
            runner: ubuntu-26.04-arm
            target: linux/arm64
            base_image: python:3.14-slim
          - provider: nvidia
            arch: amd64
            runner: ubuntu-26.04
            target: linux/amd64
            base_image: python:3.14-slim
          - provider: rockchip
            arch: arm64
            runner: ubuntu-26.04-arm
            target: linux/arm64
            base_image: python:3.14-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (sanity, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./mnemos-backend
          file: ./mnemos-backend/Dockerfile
          push: false
          load: true
          platforms: ${{ matrix.target }}
          tags: mnemos-backend:ci-${{ matrix.provider }}-${{ matrix.arch }}
          build-args: |
            INSTALL_PROVIDER=${{ matrix.provider }}
            BASE_IMAGE=${{ matrix.base_image }}
          cache-from: type=gha,scope=ci-backend-${{ matrix.provider }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-backend-${{ matrix.provider }}-${{ matrix.arch }}

  build-frontend-matrix:
    name: Frontend build (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            target: linux/amd64
          - arch: arm64
            runner: ubuntu-26.04-arm
            target: linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image (sanity, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./mnemos-frontend
          file: ./mnemos-frontend/Dockerfile
          push: false
          load: true
          platforms: ${{ matrix.target }}
          tags: mnemos-frontend:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=ci-frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-frontend-${{ matrix.arch }}
