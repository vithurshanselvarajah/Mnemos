name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Service to release'
        required: true
        default: 'both'
        type: choice
        options:
          - backend
          - frontend
          - both
      bump:
        description: 'Version bump for the unified release tag'
        required: true
        default: 'feature'
        type: choice
        options:
          - breaking
          - feature
          - hotfix

permissions:
  contents: write
  packages: write
  models: read

jobs:
  pick-services:
    name: Pick services to release
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
    steps:
      - name: Set service targets
        id: set-matrix
        run: |
          if [[ "${{ inputs.target }}" == "both" ]]; then
            echo 'targets=["backend", "frontend"]' >> "$GITHUB_OUTPUT"
          else
            echo "targets=[\"${{ inputs.target }}\"]" >> "$GITHUB_OUTPUT"
          fi

  read-versions:
    name: Read version (${{ matrix.service }})
    needs: pick-services
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      matrix:
        service: ${{ fromJSON(needs.pick-services.outputs.targets) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read service version
        id: version
        run: |
          set -euo pipefail
          # The version is the single source of truth — read it from
          # the service's own _version.py. Nothing else (not the git
          # tag, not changelog.md) is consulted.
          version="$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' \
            mnemos-${{ matrix.service }}/app/_version.py | head -n1)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read version from mnemos-${{ matrix.service }}/app/_version.py"
            exit 1
          fi
          tag="mnemos-${{ matrix.service }}-v${version}"
          echo "Read ${{ matrix.service }} version: $version (tag: $tag)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-suite:
    name: Lint and test release candidate
    needs: pick-services
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-images:
    # Matrix dimensions:
    #   service  ∈ {backend, frontend}
    #   provider ∈ {cpu, nvidia, rockchip} for backend; "" for frontend
    #   arch     ∈ {amd64, arm64}
    #
    # Provider/arch constraints (mirrored in the Dockerfile):
    #   - rockchip requires linux/arm64 (librknnrt.so is aarch64-only)
    #   - nvidia  requires linux/amd64 (nvidia/cuda base is x86_64)
    #   - cpu     builds on both arches
    #   - frontend has no provider axis; provider is forced to "" and
    #     INSTALL_PROVIDER is not passed
    name: Build image (${{ matrix.service }}${{ matrix.provider && format(' / {0}', matrix.provider) || '' }} / ${{ matrix.platform.arch }})
    needs:
      - pick-services
      - read-versions
      - test-suite
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----- Frontend: no provider -----
          - service: frontend
            provider: ""
            platform: { arch: amd64, runner: ubuntu-latest,    target: linux/amd64 }
          - service: frontend
            provider: ""
            platform: { arch: arm64, runner: ubuntu-26.04-arm,  target: linux/arm64 }
          # ----- Backend: cpu on both arches -----
          - service: backend
            provider: cpu
            platform: { arch: amd64, runner: ubuntu-latest,    target: linux/amd64 }
          - service: backend
            provider: cpu
            platform: { arch: arm64, runner: ubuntu-26.04-arm,  target: linux/arm64 }
          # ----- Backend: nvidia on amd64 only -----
          - service: backend
            provider: nvidia
            platform: { arch: amd64, runner: ubuntu-latest,    target: linux/amd64 }
          # ----- Backend: rockchip on arm64 only -----
          - service: backend
            provider: rockchip
            platform: { arch: arm64, runner: ubuntu-26.04-arm,  target: linux/arm64 }

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read image version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' \
            mnemos-${{ matrix.service }}/app/_version.py | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/mnemos-${{ matrix.service }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./mnemos-${{ matrix.service }}
          file: ./mnemos-${{ matrix.service }}/Dockerfile
          platforms: ${{ matrix.platform.target }}
          labels: ${{ steps.meta.outputs.labels }}
          # The per-provider image name is the contract the compose file
          # consumes (image: .../mnemos-backend:${MNEMOS_TAG}-${MNEMOS_PROVIDER}).
          # For the frontend (provider="") the name collapses to the
          # base repository, which is what the compose file expects.
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/mnemos-${{ matrix.service }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ${{ matrix.provider && format('INSTALL_PROVIDER={0}', matrix.provider) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Persist per-arch digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload per-arch digest artifact
        uses: actions/upload-artifact@v7
        with:
          # The provider segment is omitted for the frontend so the
          # artifact name stays a clean "digests-mnemos-frontend-<arch>".
          name: digests-mnemos-${{ matrix.service }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-images:
    # One row per (service, provider). The frontend uses provider=""
    # so it collapses to a single cell that produces one manifest
    # list for the frontend repo. The backend fans out to one cell
    # per (cpu, nvidia, rockchip), matching the tags consumed by
    # docker-compose.yml: .../mnemos-backend:${MNEMOS_TAG}-${MNEMOS_PROVIDER}.
    name: Publish image (${{ matrix.service }}${{ matrix.provider && format(' / {0}', matrix.provider) || '' }})
    needs:
      - pick-services
      - build-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            provider: ""
          - service: backend
            provider: cpu
          - service: backend
            provider: nvidia
          - service: backend
            provider: rockchip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read image version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__[[:space:]]*=[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' \
            mnemos-${{ matrix.service }}/app/_version.py | head -n1)"
          if [[ -z "$version" ]]; then
            echo "::error::Could not read version from mnemos-${{ matrix.service }}/app/_version.py"
            exit 1
          fi
          tag="mnemos-${{ matrix.service }}-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download per-arch digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-mnemos-${{ matrix.service }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          # For the backend we publish into the per-provider repo
          # (mnemos-backend-cpu, -nvidia, -rockchip). For the frontend
          # the provider segment is empty, so the repo name is just
          # mnemos-frontend.
          images: ghcr.io/${{ github.repository_owner }}/mnemos-${{ matrix.service }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=raw,value=stable
          flavor: latest=auto

      - name: Create and push multi-arch manifest list
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail

          TAG_FLAGS=$(jq -r '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/mnemos-${{ matrix.service }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }}"
          IMAGE_NAME_LOWER="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"

          DIGEST_REFS=""
          for digest in *; do
            if [[ -f "$digest" ]]; then
              DIGEST_REFS="${DIGEST_REFS} ${IMAGE_NAME_LOWER}@sha256:${digest}"
            fi
          done

          docker buildx imagetools create ${TAG_FLAGS} ${DIGEST_REFS}

      - name: Verify image in registry
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/mnemos-${{ matrix.service }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }}:${{ steps.version.outputs.version }}

      # Release notes are produced once, in the cut-release job,
      # from a single source of truth (changelog.md). They are not
      # generated per (service, provider) cell.

      - name: Bundle compose assets
        # The compose zip is identical for every backend provider cell
        # (the compose file references the per-provider image via the
        # MNEMOS_PROVIDER env var, not by being baked into the file).
        # Build it once for the frontend and once for the backend cpu
        # cell to avoid duplicate artifact names. Other cells still
        # upload their variant-qualified image-metadata.<variant>.json.
        if: ${{ matrix.service == 'frontend' || (matrix.service == 'backend' && (matrix.provider == '' || matrix.provider == 'cpu')) }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp docker-compose.yml "dist/docker-compose.yml"
          cp .env.example "dist/.env.example"
          sed "s/\${MNEMOS_TAG:-latest}/${{ steps.version.outputs.version }}/g" docker-compose.yml \
            > "dist/docker-compose.pinned.yml"
          cd dist
          zip -r "mnemos-${{ matrix.service }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }}-${{ steps.version.outputs.version }}-compose.zip" \
            docker-compose.yml .env.example docker-compose.pinned.yml
          cd ..

      - name: Write per-image metadata
        env:
          SERVICE: ${{ matrix.service }}
          PROVIDER: ${{ matrix.provider }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The image repo follows the same per-provider convention as
          # the build job: the frontend uses a bare repo name, the
          # backend uses mnemos-backend-<provider>.
          if [[ -n "${PROVIDER}" ]]; then
            image="ghcr.io/${{ github.repository_owner }}/mnemos-${SERVICE}-${PROVIDER}"
            variant_label="${SERVICE}-${PROVIDER}"
          else
            image="ghcr.io/${{ github.repository_owner }}/mnemos-${SERVICE}"
            variant_label="${SERVICE}"
          fi
          image_ref="${image}:${VERSION}"
          image_stable="${image}:stable"
          image_latest="${image}:latest"
          # The metadata filename is keyed by the variant so that
          # when the cut-release job downloads every per-image
          # bundle with actions/download-artifact merge-multiple, the
          # files do not clobber one another at the artifact root.
          # A bare "image-metadata.json" would be overwritten by
          # whichever cell finished last; the variant-qualified name
          # below survives the merge.
          cat > "image-metadata.${variant_label}.json" <<JSON
          {
            "service": "${SERVICE}",
            "provider": "${PROVIDER}",
            "variant": "${variant_label}",
            "version": "${VERSION}",
            "image": "${image_ref}",
            "image_stable": "${image_stable}",
            "image_latest": "${image_latest}",
            "tag": "mnemos-${variant_label}-v${VERSION}"
          }
          JSON
          cat "image-metadata.${variant_label}.json"

      - name: Upload per-image bundle
        uses: actions/upload-artifact@v7
        with:
          # The bundle is keyed by (service, provider) so the
          # aggregator can pick up one bundle per published image.
          # Only the canonical cells (frontend, backend/cpu) include
          # the compose zip; every cell uploads a variant-qualified
          # image-metadata.<variant>.json so the aggregator can list
          # every published image ref without the files colliding
          # during the merge-multiple download in cut-release.
          name: bundle-mnemos-${{ matrix.service }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }}-${{ steps.version.outputs.version }}
          path: |
            dist/mnemos-${{ matrix.service }}${{ matrix.provider && format('-{0}', matrix.provider) || '' }}-${{ steps.version.outputs.version }}-compose.zip
            image-metadata.*.json
          if-no-files-found: warn
          retention-days: 7

  cut-release:
    name: Cut release
    needs:
      - pick-services
      - publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download per-image bundles
        uses: actions/download-artifact@v8
        with:
          pattern: bundle-mnemos-*
          path: /tmp/bundles
          merge-multiple: true

      - name: Compute next release tag
        id: next_version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          last="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"
          if [[ -z "${last}" ]]; then
            major=0; minor=0; patch=0
          else
            stripped="${last#v}"
            IFS='.' read -r major minor patch <<< "${stripped}"
            [[ "${major:-0}" =~ ^[0-9]+$ ]] || major=0
            [[ "${minor:-0}" =~ ^[0-9]+$ ]] || minor=0
            [[ "${patch:-0}" =~ ^[0-9]+$ ]] || patch=0
          fi
          case "${BUMP}" in
            breaking) major=$((major + 1)); minor=0; patch=0 ;;
            feature)  minor=$((minor + 1)); patch=0 ;;
            hotfix)   patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump: ${BUMP}"; exit 1 ;;
          esac
          next="v${major}.${minor}.${patch}"
          echo "last_tag=${last:-<none>}"
          echo "bump=${BUMP}"
          echo "next=${next}"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - name: Collect published image references
        id: images_collect
        run: |
          set -euo pipefail
          rm -rf /tmp/images
          mkdir -p /tmp/images
          # actions/download-artifact with merge-multiple extracts
          # every per-image bundle into /tmp/bundles/ at the same
          # level, so there is no per-bundle subdirectory to walk.
          # Each cell writes its metadata as image-metadata.<variant>
          # .json, which keeps the filenames unique across cells and
          # safe to merge.
          shopt -s nullglob
          meta_files=( /tmp/bundles/image-metadata.*.json )
          shopt -u nullglob
          if [[ ${#meta_files[@]} -eq 0 ]]; then
            echo "::error::No per-image metadata found in /tmp/bundles"
            ls -la /tmp/bundles || true
            exit 1
          fi
          for meta in "${meta_files[@]}"; do
            if [[ ! -s "$meta" ]]; then
              echo "::error::Metadata file $meta is empty"
              exit 1
            fi
            # The variant is encoded in the filename between the
            # leading "image-metadata." and the trailing ".json".
            # That mirrors the "variant" field inside the JSON, but
            # deriving it from the filename keeps the collector
            # independent of the JSON payload's correctness.
            key="$(basename "$meta")"
            key="${key#image-metadata.}"
            key="${key%.json}"
            cp "$meta" "/tmp/images/${key}.json"
          done
          echo "Collected image refs:"
          for info in /tmp/images/*.json; do
            jq -r '"  - \(.variant) v\(.version) -> \(.image)"' "$info"
          done

      - name: Load changelog from source
        id: changelog_load
        run: |
          set -euo pipefail
          if [[ ! -s changelog.md ]]; then
            echo "::error::changelog.md is missing or empty at the repo root"
            exit 1
          fi
          # changelog.md is the single source of truth for release
          # content. It is curated by the maintainer. Its top-level
          # shape is plain H1-style text (no '##' prefix):
          #
          #   Mnemos-Frontend
          #   - bullet
          #   ...
          #
          #   Mnemos-Backend
          #   - bullet
          #   ...
          #
          #   General
          #   - bullet (applies to every service)
          #
          #   Notes
          #   - bullet (caveats / context)
          #
          # We pass the entire file through. The next step may lightly
          # clean it up via AI; if the AI call is unavailable, the raw
          # file is used as-is.
          cp changelog.md /tmp/changelog.md
          echo "Loaded $(wc -l < /tmp/changelog.md) lines from changelog.md"

      - name: Clean up notes with AI (optional)
        id: ai_changelog
        continue-on-error: true
        # Best-effort cleanup only. The AI is asked to lightly
        # structure the human-written changelog (fix obvious typos,
        # dedupe identical bullets, group closely related bullets
        # under a short category heading). It MUST NOT invent new
        # content, MUST NOT speculate, MUST NOT add emojis, and
        # MUST keep the tone professional and honest. If the
        # inference call fails (no token, model unavailable,
        # timeout), the next step falls back to a raw passthrough
        # of changelog.md.
        uses: actions/ai-inference@v2
        with:
          model: openai/gpt-4o
          max-tokens: 900
          system-prompt: >-
            You lightly clean up a human-written changelog file for
            the Mnemos project (a self-hosted facial recognition
            stack). The file is the only source of truth for release
            content; you may not invent new bullets, add features
            that are not in the source, speculate about future
            changes, or otherwise add material. You may not remove
            any original bullet. You may not add emojis, decorative
            punctuation, marketing language, or any text that was
            not in the source. The tone must remain professional,
            factual, and honest. Allowed edits are limited to:
            fixing obvious typos, deduplicating identical bullets,
            normalising bullet punctuation, and grouping closely
            related bullets under a short category heading such as
            "### Bug fixes" or "### Documentation". Preserve the
            existing top-level section headings (Mnemos-Frontend,
            Mnemos-Backend, General, Notes) exactly. Return plain
            Markdown only — no preamble, no closing remarks, no
            code fences around the whole document.
          prompt: |
            Clean up the following changelog. Do not invent content.
            Do not add emojis. Keep the tone professional and honest.

            $(cat /tmp/changelog.md)

      - name: Compose unified release notes
        env:
          AI_NOTES_FILE: ${{ steps.ai_changelog.outputs.response-file }}
          NEXT_VERSION: ${{ steps.next_version.outputs.next }}
        run: |
          set -euo pipefail
          {
            echo "## Mnemos ${NEXT_VERSION}"
            echo
            echo "Self-hosted facial recognition stack — backend, frontend, and pgvector."
            echo
            echo "### Changes"
            echo
            if [[ -n "${AI_NOTES_FILE:-}" && -s "$AI_NOTES_FILE" ]]; then
              cat "$AI_NOTES_FILE"
            else
              cat /tmp/changelog.md
            fi
            echo
            echo "### Docker images"
            echo
            echo "| Service | Version | Image |"
            echo "|---------|---------|-------|"
            for info in $(ls /tmp/images/*.json | sort); do
              [[ -f "$info" ]] || continue
              variant="$(jq -r '.variant' "$info")"
              ver="$(jq -r '.version' "$info")"
              img="$(jq -r '.image' "$info")"
              echo "| \`mnemos-${variant}\` | v${ver} | \`${img}\` |"
            done
            echo
            echo "### Install / upgrade"
            echo
            echo '```bash'
            echo "curl -L https://github.com/${{ github.repository }}/releases/download/${NEXT_VERSION}/docker-compose.yml -o docker-compose.yml"
            echo "curl -L https://github.com/${{ github.repository }}/releases/download/${NEXT_VERSION}/.env.example -o .env.example"
            echo "cp .env.example .env   # then edit secrets (set MNEMOS_PROVIDER=cpu|nvidia|rockchip)"
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } > release-notes.md
          echo "Wrote release-notes.md ($(wc -l < release-notes.md) lines)"

      - name: Deduplicate release notes
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          awk '
            BEGIN { section = "" }
            /^#### / { section = $0; print; next }
            /^### /  { section = "";  print; next }
            /^## /   { section = "";  print; next }
            {
              key = section "||" $0
              if ($0 ~ /^[[:space:]]*$/ || !seen[key]++) {
                print
              }
            }
          ' release-notes.md > "$tmp"
          mv "$tmp" release-notes.md
          echo "After dedupe: $(wc -l < release-notes.md) lines"

      - name: Sanity-check release notes
        run: |
          set -euo pipefail
          fail=0

          if ! grep -q '^### Docker images$' release-notes.md; then
            echo "::error::Missing '### Docker images' section"
            fail=1
          fi
          if ! grep -q '^### Changes$' release-notes.md; then
            echo "::error::Missing '### Changes' section"
            fail=1
          fi

          for info in /tmp/images/*.json; do
            [[ -f "$info" ]] || continue
            img="$(jq -r '.image' "$info")"
            if ! grep -qF "$img" release-notes.md; then
              echo "::error::Release notes missing image ref: ${img}"
              fail=1
            fi
          done

          if [[ "$fail" -ne 0 ]]; then
            echo "::group::release-notes.md"
            cat release-notes.md
            echo "::endgroup::"
            exit 1
          fi
          echo "Release notes pass sanity scan."

      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp docker-compose.yml dist/docker-compose.yml
          cp .env.example dist/.env.example
          pinned="dist/docker-compose.pinned.yml"
          sed "s/\${MNEMOS_TAG:-latest}/${{ steps.next_version.outputs.next }}/g" \
            docker-compose.yml > "$pinned"
          cd dist
          zip -r "mnemos-${{ steps.next_version.outputs.next }}-compose.zip" \
            docker-compose.yml .env.example docker-compose.pinned.yml
          cd ..
          ls -la dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next_version.outputs.next }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets only."
            gh release upload "$TAG" \
              "dist/mnemos-${TAG}-compose.zip" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/mnemos-${TAG}-compose.zip" \
              --title "Mnemos ${TAG}" \
              --notes-file release-notes.md \
              --target "${{ github.sha }}"
          fi

      - name: Write run summary
        env:
          NEXT: ${{ steps.next_version.outputs.next }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          {
            echo "## Mnemos ${NEXT}"
            echo
            echo "* Bump: \`${BUMP}\`"
            for info in $(ls /tmp/images/*.json | sort); do
              [[ -f "$info" ]] || continue
              variant="$(jq -r '.variant' "$info")"
              ver="$(jq -r '.version' "$info")"
              echo "* mnemos-${variant}: v${ver}"
            done
            echo "* Release: https://github.com/${{ github.repository }}/releases/tag/${NEXT}"
          } >> "$GITHUB_STEP_SUMMARY"